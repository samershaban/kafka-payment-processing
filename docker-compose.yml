services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft cluster (no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # HOST listener = your Spring apps on localhost:9092
      # DOCKER listener = other containers (Kafka UI) on kafka:29092
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Default for topics created without an explicit count (e.g. auto-created). Existing topics keep theirs,
      # and the services' TopicBuilder beans still set their own counts.
      KAFKA_NUM_PARTITIONS: 12
      # Persist data: topics and messages survive `docker compose down` (only `down -v` deletes them).
      # The image's default log dir is under /tmp; /var/lib/kafka/data exists in the image and is owned by its user.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Fixed cluster id, so the stored data always matches the broker (generated with kafka-storage.sh random-uuid)
      CLUSTER_ID: 5G8WsRngSW6NQ_d0bG3-cw
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  cassandra:
    image: cassandra:5.0
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      # Keep memory use low for a laptop
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      # Cassandra takes ~30-60s to boot; it's healthy once cqlsh can connect
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # One-shot job: Spring Boot can create tables, but not the keyspace, so we create it here.
  cassandra-init:
    image: cassandra:5.0
    container_name: cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    entrypoint:
      - cqlsh
      - cassandra
      - -e
      - "CREATE KEYSPACE IF NOT EXISTS orders WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};"
    restart: "no"

  # Cassandra UI: run CQL in Explore and see orders on a dashboard. http://localhost:3001 (no login locally).
  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "3001:3000"   # 3000 is often taken by local dev servers
    environment:
      GF_INSTALL_PLUGINS: hadesarchitect-cassandra-datasource
      # Local learning setup: open without logging in, as an admin. Don't do this on a shared machine.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      cassandra:
        condition: service_healthy

  # One-shot job: adds 5 random users (postgres/random-users.sql) to the Postgres on your computer, but only if
  # there are none yet besides the fixed seed users. Runs on every `docker compose up` and does nothing after
  # the first time. Needs the "orders" role/database (README step 1).
  postgres-seed:
    image: postgres:17-alpine
    container_name: postgres-seed
    environment:
      PGPASSWORD: ${DB_PASSWORD:-orders}
    volumes:
      - ./postgres/random-users.sql:/seed/random-users.sql:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach your computer's Postgres (also on Linux)
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -h
      - host.docker.internal
      - -U
      - ${DB_USERNAME:-orders}
      - -d
      - orders
      - -f
      - /seed/random-users.sql
    restart: "no"

  # Local S3-compatible object storage for the analytics data lake (RustFS, a MinIO-compatible server; MinIO no
  # longer publishes Docker images). S3 API on :9000, web console at http://localhost:9001/rustfs/console/
  # (log in with the access/secret key below). Swapping in real AWS S3 later = endpoint + credentials.
  s3:
    image: rustfs/rustfs:1.0.4
    container_name: s3
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-lakeadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-lakeadmin-secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot job: creates the data lake bucket if it doesn't exist yet (safe to run on every `up`).
  s3-init:
    image: amazon/aws-cli:2.39.3
    container_name: s3-init
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-lakeadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-lakeadmin-secret}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-kafka-orders-lake}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://s3:9000 s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null
        && echo "Bucket $$S3_BUCKET already exists"
        || aws --endpoint-url http://s3:9000 s3 mb "s3://$$S3_BUCKET"
    restart: "no"

  # Flink cluster for the analytics pipeline (raw Kafka topics → S3). Web UI: http://localhost:8084
  # The jobmanager coordinates (schedules jobs, triggers checkpoints); taskmanagers run the work.
  # More capacity: docker compose up -d --scale flink-taskmanager=3 (4 slots each).
  flink-jobmanager:
    image: flink:1.20.5-java17
    container_name: flink-jobmanager
    command: jobmanager
    ports:
      - "8084:8081"   # 8081 is order-service
    environment: &flink-env
      # S3 filesystem plugin ships in the image; this copies it into plugins/ at startup
      ENABLE_BUILT_IN_PLUGINS: flink-s3-fs-hadoop-1.20.5.jar
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        taskmanager.memory.process.size: 1536m
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 4
        s3.endpoint: http://s3:9000
        s3.path.style.access: true
        s3.access-key: ${S3_ACCESS_KEY:-lakeadmin}
        s3.secret-key: ${S3_SECRET_KEY:-lakeadmin-secret}
        state.backend.type: rocksdb
        state.checkpoints.dir: s3://${S3_BUCKET:-kafka-orders-lake}/flink/checkpoints
        state.savepoints.dir: s3://${S3_BUCKET:-kafka-orders-lake}/flink/savepoints
        execution.checkpointing.interval: 10s
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    depends_on:
      s3:
        condition: service_healthy

  flink-taskmanager:
    image: flink:1.20.5-java17
    command: taskmanager
    environment: *flink-env
    depends_on:
      - flink-jobmanager

# Postgres itself is NOT run here: the Order Service uses a Postgres installed on your computer.
# See "Set up Postgres" in README.md.

volumes:
  kafka-data:
  cassandra-data:
  grafana-data:
  s3-data:
