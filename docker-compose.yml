services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft cluster (no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # HOST listener = your Spring apps on localhost:9092
      # DOCKER listener = other containers (Kafka UI) on kafka:29092
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  cassandra:
    image: cassandra:5.0
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      # Keep memory use low for a laptop
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      # Cassandra takes ~30-60s to boot; it's healthy once cqlsh can connect
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # One-shot job: Spring Boot can create tables, but not the keyspace, so we create it here.
  cassandra-init:
    image: cassandra:5.0
    container_name: cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    entrypoint:
      - cqlsh
      - cassandra
      - -e
      - "CREATE KEYSPACE IF NOT EXISTS orders WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};"
    restart: "no"

  # One-shot job: adds 5 random users (postgres/random-users.sql) to the Postgres on your computer, but only if
  # there are none yet besides the fixed seed users. Runs on every `docker compose up` and does nothing after
  # the first time. Needs the "orders" role/database (README step 1).
  postgres-seed:
    image: postgres:17-alpine
    container_name: postgres-seed
    environment:
      PGPASSWORD: ${DB_PASSWORD:-orders}
    volumes:
      - ./postgres/random-users.sql:/seed/random-users.sql:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach your computer's Postgres (also on Linux)
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -h
      - host.docker.internal
      - -U
      - ${DB_USERNAME:-orders}
      - -d
      - orders
      - -f
      - /seed/random-users.sql
    restart: "no"

# Postgres itself is NOT run here: the Order Service uses a Postgres installed on your computer.
# See "Set up Postgres" in README.md.

volumes:
  cassandra-data:
