server:
  port: 8081

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:h2:mem:orders
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true   # http://localhost:8081/h2-console  (JDBC URL: jdbc:h2:mem:orders)

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
#      key-serializer: org.apache.kafka.common.serialization.StringSerializer
#      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        # Don't put Java class names in headers; each service owns its own event classes.
        spring.json.add.type.headers: false
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.example.orders.events.PaymentProcessedEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.example.orders.events

app:
  topics:
    order-created: orders.created
    payment-processed: payments.processed
