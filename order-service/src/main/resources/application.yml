server:
  port: 8081
  error:
    # Include which field failed @Valid in 400 responses (the UI shows it)
    include-binding-errors: always
    # Include the reason from ResponseStatusException (e.g. idempotency 409/422) in error responses
    include-message: always

spring:
  application:
    name: order-service

  cassandra:
    contact-points: localhost:9042
    local-datacenter: datacenter1      # default datacenter name of the cassandra Docker image
    keyspace-name: orders              # created by the cassandra-init container
    schema-action: create-if-not-exists   # creates the orders table from the Order class

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
#      key-serializer: org.apache.kafka.common.serialization.StringSerializer
#      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        # Don't put Java class names in headers; each service owns its own event classes.
        spring.json.add.type.headers: false
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.example.orders.events.PaymentProcessedEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.example.orders.events

app:
  topics:
    order-created: orders.created
    payment-processed: payments.processed
