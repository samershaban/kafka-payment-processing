# Tests must not depend on (or change) the local Kafka / Cassandra.
spring:
  kafka:
    admin:
      auto-create: false      # don't create topics on startup
    listener:
      auto-startup: false     # don't consume real events
  # (app.cdc.enabled=false below: no Debezium engine in tests)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.cassandra.CassandraAutoConfiguration
      - org.springframework.boot.autoconfigure.data.cassandra.CassandraDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.cassandra.CassandraRepositoriesAutoConfiguration

app:
  cdc:
    enabled: false          # no Debezium engine in tests
